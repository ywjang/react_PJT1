spring.application.name=academic-pjt1
server.port=8091
spring.profiles.default=oracle11g
lesson.storage-mode=oracle
spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@192.168.0.130:1521:HJDB}
spring.datasource.username=${ORACLE_USERNAME:scott}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
spring.jackson.time-zone=Asia/Seoul



