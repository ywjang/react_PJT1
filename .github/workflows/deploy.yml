name: Deploy React to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v7

      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: React 빌드
        run: npm run build -- --base=/react_PJT1/

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: 빌드 파일 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: 사이트 배포
        id: deployment
        uses: actions/deploy-pages@v5
